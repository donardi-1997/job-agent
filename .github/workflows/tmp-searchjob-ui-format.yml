name: Temporary SearchJob UI formatter

on:
  push:
    branches:
      - improve/dashboard-ui-ux
    paths:
      - '.github/workflows/tmp-searchjob-ui-format.yml'

permissions:
  contents: write

jobs:
  format-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: improve/dashboard-ui-ux

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Sync formatting toolchain
        run: uv sync --dev --extra core --python 3.12

      - name: Format only dashboard route
        run: uv run --no-sync ruff format job_agent/dashboard.py

      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add job_agent/dashboard.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): format dashboard route'
            git push origin HEAD:improve/dashboard-ui-ux
          fi
