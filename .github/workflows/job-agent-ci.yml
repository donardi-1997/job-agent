name: Job Agent CI

on:
  pull_request:
    branches:
      - develop/computrabajo-agent
    paths:
      - 'job_agent/**'
      - 'tests/job_agent/**'
      - 'run_job_agent.py'
      - 'pyproject.toml'
      - '.github/workflows/job-agent-ci.yml'
  push:
    branches:
      - develop/computrabajo-agent
      - 'improve/**'
    paths:
      - 'job_agent/**'
      - 'tests/job_agent/**'
      - 'run_job_agent.py'
      - 'pyproject.toml'
      - '.github/workflows/job-agent-ci.yml'

permissions:
  contents: read

concurrency:
  group: job-agent-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  job-agent-tests:
    name: SearchJob / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_USE_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --extra core --python 3.12

      - name: Compile Job Agent
        run: uv run --no-sync python -m compileall -q job_agent run_job_agent.py

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          for file in job_agent/dashboard_static/*.js; do
            node --check "$file"
          done

      - name: Verify zero-cost provider guard
        run: uv run --no-sync pytest tests/job_agent/test_ai_usage.py::test_zero_cost_mode_blocks_before_provider_call -q

      - name: Run SearchJob tests
        shell: bash
        run: |
          JOB_AGENT_ZERO_COST=0 \
          JOB_AGENT_SEARCH_AI_FALLBACK=1 \
          JOB_AGENT_QUESTION_LLM=1 \
          JOB_AGENT_APPLICATION_AI_FALLBACK=1 \
          BROWSER_USE_API_KEY= \
          uv run --no-sync pytest tests/job_agent -q
