name: Temporary SearchJob formatter

on:
  push:
    branches:
      - improve/computrabajo-smoke-test

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/computrabajo-smoke-test
      - uses: astral-sh/setup-uv@v6
      - name: Format SearchJob files
        run: |
          uvx ruff format \
            job_agent/computrabajo/smoke_test.py \
            tests/job_agent/test_computrabajo_smoke_test.py \
            job_agent/semantic_answers.py \
            tests/job_agent/test_semantic_form_resolution.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- \
            job_agent/computrabajo/smoke_test.py \
            tests/job_agent/test_computrabajo_smoke_test.py \
            job_agent/semantic_answers.py \
            tests/job_agent/test_semantic_form_resolution.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            job_agent/computrabajo/smoke_test.py \
            tests/job_agent/test_computrabajo_smoke_test.py \
            job_agent/semantic_answers.py \
            tests/job_agent/test_semantic_form_resolution.py
          git commit -m "style(job-agent): apply Ruff formatting"
          git push origin HEAD:improve/computrabajo-smoke-test
